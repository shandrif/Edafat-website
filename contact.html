<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#221c19">
<title>Contact | Edafat</title><meta name="description" content="Questions about a brand or a range? Send us a message.">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="contact"><header id="hdr"></header><main>

<section class="phead"><div class="crumb">Contact</div><h1>Let's talk.</h1><p class="sub">Questions about a brand or a range? Send us a message.</p></section>
<section class="sec pad" style="padding-top:clamp(48px,7vw,90px)"><div class="two" style="align-items:start">
 <div class="details rv"><div><h3>Email</h3><p id="c-mail"></p></div><div><h3>Phone</h3><p id="c-phone"></p></div><div><h3>Location</h3><p id="c-city"></p></div>
  <p class="muted" style="font-size:.9rem">Placeholder contact details. Replace before launch.</p></div>
 <form id="cform" class="rv" style="--d:.1s"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label>
  <label>Message<textarea name="message" rows="5" required></textarea></label><button class="btn dark" style="justify-self:start">Send message</button></form></div></section>
</main><footer id="ftr"></footer><script src="js/data.js"></script><script src="js/glyphs.js"></script><script src="js/app.js"></script></body></html>
